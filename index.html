<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shishir Collection</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f4f7fb;color:#172033;
 font-family:Arial,"Noto Sans Bengali",sans-serif
}
header{
 background:#123b70;color:white;padding:18px 15px;
 text-align:center;box-shadow:0 2px 8px #0002
}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;font-size:13px}
.container{max-width:1100px;margin:auto;padding:15px}

.stats{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:10px;margin-bottom:15px
}
.stat{
 background:white;border-radius:12px;padding:15px;
 border-left:4px solid #155eef;box-shadow:0 2px 7px #0001
}
.stat small{display:block;color:#667085}
.stat strong{font-size:23px;display:block;margin-top:5px}

.card{
 background:white;border-radius:12px;padding:16px;
 margin-bottom:15px;box-shadow:0 2px 8px #0001
}
.card h2{margin-top:0;font-size:19px}

.grid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:12px
}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}
input,select{
 width:100%;padding:12px;border:1px solid #d0d5dd;
 border-radius:8px;font-size:15px;outline:none
}
input:focus{border-color:#155eef}

button{
 border:0;border-radius:8px;padding:11px 15px;
 cursor:pointer;font-size:14px
}
.primary{background:#155eef;color:white}
.success{background:#078647;color:white}
.danger{background:#d92d20;color:white}
.gray{background:#667085;color:white}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}

.search{
 margin-bottom:12px
}

.table-wrap{overflow-x:auto}
table{
 width:100%;border-collapse:collapse;min-width:850px
}
th,td{
 border-bottom:1px solid #eaecf0;padding:11px;
 text-align:left;font-size:13px
}
th{background:#f2f4f7}
.badge{
 display:inline-block;padding:5px 8px;border-radius:20px;
 font-size:12px;font-weight:bold
}
.paid{background:#dcfae6;color:#067647}
.due{background:#fee4e2;color:#b42318}

.empty{
 text-align:center;padding:30px;color:#667085
}

@media(max-width:750px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .grid{grid-template-columns:1fr}
 .stat strong{font-size:20px}
}
</style>
</head>

<body>

<header>
<h1>Shishir Collection</h1>
<p>মোটরসাইকেল কিস্তি কালেকশন ম্যানেজার</p>
</header>

<div class="container">

<!-- DASHBOARD -->
<div class="stats">
<div class="stat">
<small>মোট কাস্টমার</small>
<strong id="totalCustomers">0</strong>
</div>

<div class="stat">
<small>আজকের কালেকশন</small>
<strong id="todayCollection">৳ 0</strong>
</div>

<div class="stat">
<small>এই মাসের কালেকশন</small>
<strong id="monthCollection">৳ 0</strong>
</div>

<div class="stat">
<small>মোট বাকি</small>
<strong id="totalDue">৳ 0</strong>
</div>
</div>

<!-- CUSTOMER FORM -->
<div class="card">
<h2 id="formTitle">➕ নতুন কাস্টমার যোগ করুন</h2>

<div class="grid">

<div>
<label>কাস্টমার কোড *</label>
<input id="customerCode" placeholder="যেমন: C-001">
</div>

<div>
<label>কাস্টমারের নাম *</label>
<input id="customerName" placeholder="কাস্টমারের নাম">
</div>

<div>
<label>মোবাইল নম্বর</label>
<input id="phone" type="tel" placeholder="01XXXXXXXXX">
</div>

<div>
<label>মোট কিস্তি / বাকি টাকা</label>
<input id="totalAmount" type="number" placeholder="যেমন: 120000">
</div>

<div>
<label>কিস্তির টাকা</label>
<input id="installmentAmount" type="number" placeholder="যেমন: 5000">
</div>

<div>
<label>পরবর্তী কিস্তির তারিখ</label>
<input id="nextDate" type="date">
</div>

<div>
<label>আজ জমা টাকা</label>
<input id="payment" type="number" placeholder="আজ কত টাকা জমা">
</div>

</div>

<div class="actions">
<button class="primary" onclick="saveCustomer()">💾 কাস্টমার সেভ করুন</button>
<button class="gray" onclick="resetForm()">↻ রিসেট</button>
</div>

<input type="hidden" id="editId">
</div>

<!-- SEARCH -->
<div class="card">
<h2>🔎 কাস্টমার খুঁজুন</h2>
<input class="search" id="search" oninput="renderCustomers()"
placeholder="নাম / কাস্টমার কোড / মোবাইল দিয়ে খুঁজুন">
</div>

<!-- CUSTOMER LIST -->
<div class="card">
<h2>👥 কাস্টমার তালিকা</h2>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>কোড</th>
<th>নাম</th>
<th>মোবাইল</th>
<th>মোট টাকা</th>
<th>জমা</th>
<th>বাকি</th>
<th>পরবর্তী তারিখ</th>
<th>অবস্থা</th>
<th>কাজ</th>
</tr>
</thead>

<tbody id="customerTable"></tbody>
</table>
</div>

<div id="empty" class="empty">
কোনো কাস্টমার নেই
</div>
</div>

</div>

<script>

let customers = JSON.parse(localStorage.getItem("shishirCustomers") || "[]");

function money(n){
 return "৳ " + Number(n || 0).toLocaleString("bn-BD");
}

function saveData(){
 localStorage.setItem("shishirCustomers",JSON.stringify(customers));
}

function saveCustomer(){

 let code=document.getElementById("customerCode").value.trim();
 let name=document.getElementById("customerName").value.trim();
 let phone=document.getElementById("phone").value.trim();
 let total=Number(document.getElementById("totalAmount").value||0);
 let installment=Number(document.getElementById("installmentAmount").value||0);
 let nextDate=document.getElementById("nextDate").value;
 let payment=Number(document.getElementById("payment").value||0);
 let editId=document.getElementById("editId").value;

 if(!code || !name){
   alert("কাস্টমার কোড এবং নাম অবশ্যই দিতে হবে।");
   return;
 }

 if(editId){

   let c=customers.find(x=>x.id==editId);

   if(c){
     c.code=code;
     c.name=name;
     c.phone=phone;
     c.total=total;
     c.installment=installment;
     c.nextDate=nextDate;

     if(payment>0){
       c.paid=Number(c.paid||0)+payment;
       c.payments.push({
         amount:payment,
         date:new Date().toISOString().slice(0,10)
       });
     }
   }

 }else{

   if(customers.some(x=>x.code===code)){
     alert("এই কাস্টমার কোড আগে থেকেই আছে।");
     return;
   }

   customers.push({
     id:Date.now(),
     code,
     name,
     phone,
     total,
     installment,
     paid:payment,
     nextDate,
     payments: payment>0 ? [{
       amount:payment,
       date:new Date().toISOString().slice(0,10)
     }] : []
   });
 }

 saveData();
 resetForm();
 renderCustomers();
 updateDashboard();

 alert("কাস্টমার তথ্য সফলভাবে সেভ হয়েছে।");
}

function editCustomer(id){

 let c=customers.find(x=>x.id==id);
 if(!c)return;

 document.getElementById("editId").value=c.id;
 document.getElementById("customerCode").value=c.code;
 document.getElementById("customerName").value=c.name;
 document.getElementById("phone").value=c.phone;
 document.getElementById("totalAmount").value=c.total;
 document.getElementById("installmentAmount").value=c.installment;
 document.getElementById("nextDate").value=c.nextDate;

 document.getElementById("payment").value="";

 document.getElementById("formTitle").innerText="✏️ কাস্টমার তথ্য পরিবর্তন করুন";

 window.scrollTo({top:0,behavior:"smooth"});
}

function deleteCustomer(id){

 if(!confirm("এই কাস্টমারকে ডিলিট করতে চান?"))return;

 customers=customers.filter(x=>x.id!=id);

 saveData();
 renderCustomers();
 updateDashboard();

 alert("কাস্টমার ডিলিট হয়েছে।");
}

function resetForm(){

 document.getElementById("editId").value="";
 document.getElementById("customerCode").value="";
 document.getElementById("customerName").value="";
 document.getElementById("phone").value="";
 document.getElementById("totalAmount").value="";
 document.getElementById("installmentAmount").value="";
 document.getElementById("nextDate").value="";
 document.getElementById("payment").value="";

 document.getElementById("formTitle").innerText="➕ নতুন কাস্টমার যোগ করুন";
}

function renderCustomers(){

 let tbody=document.getElementById("customerTable");
 let empty=document.getElementById("empty");
 let search=document.getElementById("search").value.toLowerCase();

 tbody.innerHTML="";

 let list=customers.filter(c=>
   c.name.toLowerCase().includes(search) ||
   c.code.toLowerCase().includes(search) ||
   c.phone.toLowerCase().includes(search)
 );

 if(list.length===0){
   empty.style.display="block";
   return;
 }

 empty.style.display="none";

 list.forEach(c=>{

   let due=Math.max(0,Number(c.total)-Number(c.paid));

   let status=due<=0
      ? `<span class="badge paid">সম্পূর্ণ পরিশোধ</span>`
      : `<span class="badge due">বাকি ${money(due)}</span>`;

   let date=c.nextDate
      ? new Date(c.nextDate+"T00:00:00").toLocaleDateString("bn-BD")
      : "-";

   tbody.innerHTML+=`

   <tr>
   <td><b>${escapeHtml(c.code)}</b></td>

   <td>${escapeHtml(c.name)}</td>

   <td>${escapeHtml(c.phone||"-")}</td>

   <td>${money(c.total)}</td>

   <td>${money(c.paid)}</td>

   <td><b>${money(due)}</b></td>

   <td>${date}</td>

   <td>${status}</td>

   <td>
   <button class="primary" onclick="editCustomer(${c.id})">✏️</button>
   <button class="danger" onclick="deleteCustomer(${c.id})">🗑️</button>
   </td>

   </tr>
   `;
 });
}

function escapeHtml(text){

 return String(text||"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function updateDashboard(){

 document.getElementById("totalCustomers").innerText=
   customers.length;

 let today=new Date().toISOString().slice(0,10);

 let month=today.slice(0,7);

 let todayTotal=0;
 let monthTotal=0;

 customers.forEach(c=>{

   (c.payments||[]).forEach(p=>{

     if(p.date===today){
       todayTotal+=Number(p.amount||0);
     }

     if(p.date.startsWith(month)){
       monthTotal+=Number(p.amount||0);
     }

   });

 });

 let due=customers.reduce(
   (sum,c)=>sum+Math.max(0,Number(c.total)-Number(c.paid)),0
 );

 document.getElementById("todayCollection").innerText=
   money(todayTotal);

 document.getElementById("monthCollection").innerText=
   money(monthTotal);

 document.getElementById("totalDue").innerText=
   money(due);
}

renderCustomers();
updateDashboard();

</script>

</body>
</html>
